<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>منوی رستوران | موبایل</title>
  <!-- فونت وزیرمتن از CDN -->
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Vazirmatn', sans-serif;
      background-color: #f5f0eb;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 0;
      margin: 0;
    }

    /* کانتینر اصلی شبیه صفحه موبایل */
    .mobile-container {
      width: 100%;
      max-width: 420px;
      background-color: #ffffff;
      box-shadow: 0 0 30px rgba(0,0,0,0.1);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      border-radius: 0;
    }

    /* هدر */
    .header {
      background-color: #2d2d2d;
      color: white;
      padding: 16px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      border-bottom: 3px solid #c9a96e;
    }

    .logo-placeholder {
      width: 48px;
      height: 48px;
      background-color: #c9a96e;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: bold;
      color: #2d2d2d;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%232d2d2d" width="28px" height="28px"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>');
      background-size: 28px;
      background-repeat: no-repeat;
      background-position: center;
      background-color: #e6d5b8;
    }

    .header-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .header-btn {
      background-color: transparent;
      border: 1px solid #c9a96e;
      color: #f0e6d3;
      padding: 8px 14px;
      border-radius: 25px;
      font-family: 'Vazirmatn', sans-serif;
      font-size: 14px;
      cursor: pointer;
      transition: 0.2s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .header-btn:hover {
      background-color: #c9a96e;
      color: #1a1a1a;
      border-color: #c9a96e;
    }

    /* عنوان صفحه */
    .page-title {
      padding: 20px 16px 8px;
      font-size: 22px;
      font-weight: 700;
      color: #3e3e3e;
      text-align: center;
    }

    /* شبکه کارت های دسته بندی */
    .category-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      padding: 12px 16px 24px;
    }

    .category-card {
      background-color: #fff;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 6px 14px rgba(0,0,0,0.08);
      transition: transform 0.2s, box-shadow 0.2s;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      position: relative;
      aspect-ratio: 1 / 1.1;
      background-color: #f9f6f0;
      border: 1px solid #ede3d3;
    }

    .category-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 22px rgba(0,0,0,0.12);
    }

    .card-img {
      width: 100%;
      height: 70%;
      object-fit: cover;
      background-color: #d9cdb3;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="%23b8a88a"><circle cx="50" cy="40" r="18"/><path d="M22 78c0-15 12-28 28-28s28 13 28 28" fill="%23b8a88a"/></svg>');
      background-size: 60px;
      background-repeat: no-repeat;
      background-position: center 40%;
    }

    .card-label {
      height: 30%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 600;
      background-color: #ffffff;
      color: #3e3e3e;
      text-align: center;
      padding: 4px 6px;
      border-top: 1px solid #f0e8da;
      letter-spacing: -0.2px;
    }

    /* فوتر یا متن کمکی */
    .footer-note {
      text-align: center;
      font-size: 12px;
      color: #999;
      padding: 12px;
      margin-top: auto;
      border-top: 1px solid #eee;
    }

    /* تطبیق برای موبایل های کوچک */
    @media (max-width: 380px) {
      .category-card .card-label {
        font-size: 14px;
      }
      .header-btn {
        padding: 6px 10px;
        font-size: 13px;
      }
    }
  </style>
</head>
<body>

</html>
